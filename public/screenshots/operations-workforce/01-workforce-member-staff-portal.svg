<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Workforce member detail showing staff portal link controls</title>
  <desc id="desc">A SympleHost-style interface showing Team Ops, Workforce, a member profile, and the Staff Portal card with portal language, copy link, and revoke link controls.</desc>
  <rect width="1440" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="220" height="900" fill="#fff"/>
  <rect x="0" y="0" width="220" height="900" fill="none" stroke="#e5e7eb"/>
  <circle cx="36" cy="36" r="18" fill="#d7bb68"/>
  <text x="62" y="43" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">SympleHost</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" fill="#4b5563">
    <text x="56" y="114">Overview</text>
    <text x="56" y="164">Calendars</text>
    <text x="56" y="214">Messages</text>
    <text x="56" y="264">Reservations</text>
    <rect x="14" y="288" width="192" height="44" rx="8" fill="#f4eaff"/>
    <text x="56" y="316" fill="#8e31ec">Operations</text>
    <text x="56" y="366">Customers</text>
    <text x="56" y="416">Reviews</text>
    <text x="56" y="466">Guide Books</text>
  </g>
  <rect x="220" y="0" width="1220" height="64" fill="#fff"/>
  <rect x="220" y="63" width="1220" height="1" fill="#e5e7eb"/>
  <text x="1092" y="38" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#4b5563">Team Chat</text>
  <text x="1198" y="38" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#4b5563">Help</text>
  <circle cx="1328" cy="32" r="17" fill="#111827"/>
  <text x="1318" y="38" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">AM</text>
  <text x="1375" y="38" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#4b5563">Amit</text>
  <g transform="translate(262 104)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" font-size="14" fill="#6b7280">Team Ops / Workforce / Maria Santos</text>
    <text x="0" y="42" font-size="34" font-weight="800" fill="#111827">Maria Santos</text>
    <text x="0" y="72" font-size="16" fill="#667085">Cleaner · active · assigned to property operations</text>
    <rect x="0" y="104" width="1136" height="52" rx="13" fill="#fff" stroke="#e5e7eb"/>
    <text x="28" y="137" font-size="15" font-weight="800" fill="#8e31ec">Overview</text>
    <text x="142" y="137" font-size="15" font-weight="700" fill="#667085">Assignments</text>
    <text x="274" y="137" font-size="15" font-weight="700" fill="#667085">Payments</text>
    <rect x="0" y="188" width="548" height="270" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <circle cx="52" cy="242" r="29" fill="#f4eaff"/>
    <text x="38" y="251" font-size="18" font-weight="800" fill="#8e31ec">MS</text>
    <text x="100" y="232" font-size="18" font-weight="800" fill="#111827">Profile</text>
    <text x="100" y="260" font-size="14" fill="#667085">Phone, role, active status, and operational capabilities.</text>
    <rect x="28" y="306" width="118" height="32" rx="16" fill="#e0f2fe"/>
    <text x="52" y="327" font-size="13" font-weight="800" fill="#0369a1">Cleaning</text>
    <rect x="156" y="306" width="138" height="32" rx="16" fill="#fff7ed"/>
    <text x="180" y="327" font-size="13" font-weight="800" fill="#c2410c">Maintenance</text>
    <rect x="28" y="374" width="492" height="52" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="48" y="398" font-size="13" font-weight="700" fill="#475467">Working schedule and capabilities can be edited here.</text>
    <text x="48" y="417" font-size="12" fill="#98a2b3">Use this to keep assignments realistic for the cleaner.</text>
    <rect x="588" y="188" width="548" height="270" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="620" y="232" font-size="18" font-weight="800" fill="#111827">Staff Portal</text>
    <text x="620" y="260" font-size="14" fill="#667085">Generate a link cleaners can open without a full host login.</text>
    <rect x="620" y="294" width="484" height="54" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="644" y="316" font-size="12" font-weight="800" fill="#667085">Portal language</text>
    <text x="644" y="337" font-size="14" font-weight="700" fill="#111827">English</text>
    <rect x="620" y="368" width="388" height="50" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="644" y="398" font-size="13" fill="#667085">https://app.symplehost.ai/en/staff/******</text>
    <rect x="1018" y="368" width="86" height="50" rx="12" fill="#8e31ec"/>
    <text x="1046" y="398" font-size="14" font-weight="800" fill="#fff">Copy</text>
    <text x="620" y="444" font-size="13" font-weight="800" fill="#dc2626">Revoke link</text>
    <rect x="0" y="492" width="1136" height="220" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="28" y="535" font-size="18" font-weight="800" fill="#111827">Assignments</text>
    <text x="28" y="563" font-size="14" fill="#667085">Track this cleaner's active, completed, and expired work from the manager view.</text>
    <g transform="translate(28 594)">
      <rect width="1080" height="76" rx="13" fill="#fbfdff" stroke="#e5e7eb"/>
      <rect x="18" y="18" width="40" height="40" rx="12" fill="#f4eaff"/>
      <text x="31" y="44" font-size="22" font-weight="800" fill="#8e31ec">✓</text>
      <text x="78" y="32" font-size="16" font-weight="800" fill="#111827">Checkout turnover · Harbour View Villa</text>
      <text x="78" y="56" font-size="13" fill="#667085">Due today 11:00 AM · checklist attached · 4/7 items complete</text>
      <rect x="880" y="20" width="138" height="36" rx="10" fill="#f4eaff"/>
      <text x="912" y="43" font-size="13" font-weight="800" fill="#8e31ec">View details</text>
    </g>
