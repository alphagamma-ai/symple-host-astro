services:
  - type: web
    name: symplehost-knowledge-base
    runtime: static
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: "/*.md"
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: "/*.md"
        name: Vary
        value: Accept, Accept-Encoding
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms.txt
        name: Vary
        value: Accept, Accept-Encoding
