services:
  - type: web
    name: symplehost-knowledge-base
    runtime: node
    # Not `free` — free web services spin down when idle, and a 50s cold start
    # in front of the docs defeats the point of serving agents quickly.
    plan: starter
    buildCommand: pnpm install && pnpm run build && node scripts/verify-build.mjs && node scripts/verify-server.mjs
    startCommand: node server/index.mjs
    healthCheckPath: /llms.txt
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
